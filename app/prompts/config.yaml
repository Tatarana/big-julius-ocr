default_system_prompt: |
  Extract bank transactions. Respond ONLY with a JSON object.
  Minify output (no whitespace).
  Format:
  {"transactions": [{"date": "DD-MM-YYYY", "description": "text", "amount": 1.23, "balance": 4.56}]}
