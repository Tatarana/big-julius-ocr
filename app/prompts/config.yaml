# Prompt Configuration
# Structure: banks.<bank>.<provider>.<statement_type>.<send_mode>

default_system_prompt: |
  Extract bank transactions. Respond ONLY with a JSON object.
  Minify output (no whitespace).
  Format: {"transactions": [{"date": "DD-MM-YYYY", "description": "text", "installments": "", "amount": 1.23, "balance": 4.56, "category": "Outros"}]}

banks:
  picpay:
    openai:
      ccstatement:
        chunks: "picpay/openai/ccstatement/chunks.txt"
        images: "picpay/openai/ccstatement/images.txt"
      bankstatement:
        chunks: "picpay/openai/bankstatement/chunks.txt"
        images: "picpay/openai/bankstatement/images.txt"
    google:
      ccstatement:
        chunks: "picpay/google/ccstatement/chunks.txt"
        images: "picpay/google/ccstatement/images.txt"
        pdf: "picpay/google/ccstatement/pdf.txt"
